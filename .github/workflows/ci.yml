name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  spec:
    name: rspec (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # Resolves bundler from the gemspec's own '~> 2.0' constraint and
          # caches the installed gems.
          bundler-cache: true

      - name: Run specs
        # Both formatters are explicit: a CLI --format overrides the one in
        # .rspec, so without this the log would be empty on failure. The JSON
        # file feeds the gate below.
        run: >-
          bundle exec rspec
          --format documentation
          --format json --out rspec-results.json

      - name: Assert the suite actually executed
        run: ruby .github/scripts/assert_specs_ran.rb rspec-results.json

  route-check:
    name: Base URLs are routed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Ask the client, so a base URL change cannot pass unprobed.
      - name: Probe the base URLs the clients build
        run: |
          bundle exec ruby -Ilib -rjson -rpaubox -e '
            Paubox.configure { |c| c.api_key = "route-check" }
            puts Paubox::Client.new.send(:api_base_endpoint)
            f = Paubox::FormsClient
            puts "#{f::FORMS_PROTOCOL}#{f::FORMS_HOST}#{f::FORMS_BASE}"
            # The webhooks base is probed with /endpoints appended. The gateway
            # scopes its rule to that one resource so the producers event-ingest
            # route stays off the public host, which leaves the bare base
            # unrouted by design — probing it directly would fail this check for
            # a URL the client never requests on its own.
            w = Paubox::WebhooksClient
            puts "#{w::WEBHOOKS_PROTOCOL}#{w::WEBHOOKS_HOST}#{w::WEBHOOKS_BASE}/endpoints"
          ' | .github/scripts/route-check.sh
